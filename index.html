<!doctype html>
<html lang="ru">
    <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>GMod сервер</title>
        <style>
            :root {
                --bg: #14171c;
                --panel: #1c2128;
                --line: #2d343e;
                --text: #d7dde5;
                --dim: #8a94a3;
                --accent: #f0a93b;
                --ok: #5ec27a;
                --bad: #e5675c;
                --warn: #d9b84a;
                color-scheme: dark;
            }
            * {
                box-sizing: border-box;
            }
            html,
            body {
                height: 100%;
                margin: 0;
            }
            body {
                background: var(--bg);
                color: var(--text);
                font:
                    15px/1.45 system-ui,
                    sans-serif;
                display: flex;
                flex-direction: column;
            }
            button,
            input,
            select {
                font: inherit;
                color: inherit;
            }
            :focus-visible {
                outline: 2px solid var(--accent);
                outline-offset: 2px;
            }

            #connect {
                display: none;
                width: 100%;
                padding: 12px 20px;
                border: 0;
                border-bottom: 1px solid var(--line);
                background: #1d2a1f;
                color: var(--ok);
                text-align: left;
                cursor: pointer;
                font:
                    600 17px/1.3 ui-monospace,
                    "JetBrains Mono",
                    monospace;
            }
            #connect.show {
                display: flex;
                justify-content: space-between;
                gap: 16px;
            }
            #connect:hover {
                background: #22331f;
            }
            #connect small {
                font:
                    13px system-ui,
                    sans-serif;
                color: var(--dim);
                white-space: nowrap;
            }
            #connect.copied small {
                color: var(--ok);
            }

            header {
                display: flex;
                align-items: center;
                gap: 12px;
                flex-wrap: wrap;
                padding: 12px 20px;
                background: var(--panel);
                border-bottom: 1px solid var(--line);
            }
            #server {
                min-width: 180px;
                padding: 8px 10px;
                background: var(--bg);
                border: 1px solid var(--line);
                border-radius: 6px;
                cursor: pointer;
            }
            #server:hover {
                border-color: var(--accent);
            }
            .tabs {
                display: flex;
                gap: 4px;
                margin-right: auto;
            }
            .tab {
                background: none;
                border: 0;
                padding: 8px 14px;
                border-radius: 6px;
                color: var(--dim);
                cursor: pointer;
            }
            .tab[aria-selected="true"] {
                color: var(--text);
                background: var(--bg);
                box-shadow: inset 0 -2px var(--accent);
            }
            #status {
                display: flex;
                align-items: center;
                gap: 8px;
                color: var(--dim);
            }
            #status i {
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--dim);
            }
            #status[data-s="running"] i {
                background: var(--ok);
            }
            #status[data-s="starting"] i,
            #status[data-s="stopping"] i {
                background: var(--warn);
            }
            #status[data-s="stopped"] i {
                background: var(--bad);
            }
            .btn {
                padding: 8px 16px;
                border-radius: 6px;
                border: 1px solid var(--line);
                background: var(--bg);
                cursor: pointer;
            }
            .btn:hover:not(:disabled) {
                border-color: var(--accent);
            }
            .btn:disabled {
                opacity: 0.4;
                cursor: not-allowed;
            }
            .btn.primary {
                background: var(--accent);
                border-color: var(--accent);
                color: #1a1405;
                font-weight: 600;
            }

            main {
                flex: 1;
                min-height: 0;
                display: flex;
            }
            section {
                display: none;
                flex: 1;
                min-width: 0;
                min-height: 0;
            }
            section.active {
                display: flex;
            }

            #view-console {
                flex-direction: column;
            }
            #console {
                flex: 1;
                overflow: auto;
                padding: 12px 20px;
                white-space: pre-wrap;
                word-break: break-word;
                font:
                    13px/1.5 ui-monospace,
                    "JetBrains Mono",
                    monospace;
            }
            #console .err {
                color: var(--bad);
            }
            #console .warn {
                color: var(--warn);
            }
            #console .cmd,
            #console .panel {
                color: var(--accent);
            }
            #console .empty {
                color: var(--dim);
                font-family: system-ui, sans-serif;
                font-size: 15px;
            }
            #cmdform {
                display: flex;
                border-top: 1px solid var(--line);
                background: var(--panel);
            }
            #cmdform input {
                flex: 1;
                padding: 12px 20px;
                background: none;
                border: 0;
                font:
                    14px ui-monospace,
                    "JetBrains Mono",
                    monospace;
            }

            #view-settings {
                padding: 24px 20px;
                overflow: auto;
            }
            form#cfg {
                width: 100%;
                max-width: 520px;
                display: grid;
                gap: 16px;
                align-content: start;
            }
            label {
                display: grid;
                gap: 6px;
            }
            label span {
                color: var(--dim);
                font-size: 13px;
            }
            input[type="text"],
            input[type="number"] {
                padding: 9px 12px;
                background: var(--panel);
                border: 1px solid var(--line);
                border-radius: 6px;
                width: 100%;
            }
            label.check {
                display: flex;
                align-items: center;
                gap: 10px;
            }
            .row {
                display: flex;
                align-items: center;
                gap: 14px;
            }
            .msg {
                color: var(--dim);
                font-size: 14px;
            }
            .msg.error {
                color: var(--bad);
            }
            .hint {
                color: var(--dim);
                font-size: 13px;
                margin: 0;
            }
            code {
                font-family: ui-monospace, monospace;
            }

            dialog {
                width: min(420px, calc(100vw - 32px));
                padding: 24px;
                background: var(--panel);
                color: var(--text);
                border: 1px solid var(--line);
                border-radius: 10px;
            }
            dialog::backdrop {
                background: rgba(0, 0, 0, 0.6);
            }
            dialog h2 {
                margin: 0 0 16px;
                font-size: 18px;
            }
            dialog form {
                display: grid;
                gap: 14px;
            }
            dialog .row {
                justify-content: flex-end;
            }
        </style>
    </head>
    <body>
        <button id="connect" type="button" title="Нажмите, чтобы скопировать">
            <span id="connect-text"></span
            ><small>Нажмите, чтобы скопировать</small>
        </button>

        <header>
            <select id="server" aria-label="Сервер"></select>
            <div class="tabs" role="tablist">
                <button
                    class="tab"
                    role="tab"
                    aria-selected="true"
                    data-tab="console"
                >
                    Консоль
                </button>
                <button
                    class="tab"
                    role="tab"
                    aria-selected="false"
                    data-tab="settings"
                >
                    Настройки
                </button>
            </div>
            <div id="status" data-s="stopped">
                <i></i><span id="status-text">Остановлен</span>
            </div>
            <button class="btn primary" id="b-start">Включить</button>
            <button class="btn" id="b-stop">Выключить</button>
            <button class="btn" id="b-restart">Перезапустить</button>
        </header>

        <main>
            <section id="view-console" class="active">
                <div id="console" aria-live="off"></div>
                <form id="cmdform" autocomplete="off">
                    <input
                        id="cmd"
                        placeholder="Команда серверу"
                        aria-label="Команда серверу"
                    />
                </form>
            </section>

            <section id="view-settings">
                <form id="cfg">
                    <label
                        ><span>ID коллекции Workshop</span
                        ><input
                            type="text"
                            name="workshop_collection"
                            inputmode="numeric"
                    /></label>
                    <label
                        ><span>Режим игры</span
                        ><input type="text" name="gamemode"
                    /></label>
                    <label
                        ><span>Карта</span><input type="text" name="map"
                    /></label>
                    <label
                        ><span>Максимум игроков</span
                        ><input
                            type="number"
                            name="maxplayers"
                            min="1"
                            max="128"
                    /></label>
                    <label
                        ><span>Порт</span
                        ><input
                            type="number"
                            name="port"
                            min="1024"
                            max="65535"
                    /></label>
                    <label class="check"
                        ><input type="checkbox" name="update_on_start" />
                        Устанавливать и обновлять сервер через steamcmd при
                        запуске</label
                    >
                    <label class="check"
                        ><input type="checkbox" name="auto_restart" />
                        Перезапускать сервер после сбоя</label
                    >
                    <div class="row">
                        <button class="btn primary" type="submit">
                            Сохранить
                        </button>
                        <span class="msg" id="msg"></span>
                    </div>
                    <p class="hint">
                        Файлы сервера: <code id="path"></code>. Изменения
                        применятся при следующем запуске или перезапуске.
                    </p>
                </form>
            </section>
        </main>

        <dialog id="dlg">
            <h2>Новый сервер</h2>
            <form id="newform" autocomplete="off">
                <label
                    ><span>Имя (станет названием папки в servers/)</span>
                    <input
                        type="text"
                        id="newname"
                        maxlength="40"
                        placeholder="например: sandbox"
                        required
                /></label>
                <span class="msg" id="newmsg"></span>
                <div class="row">
                    <button class="btn" type="button" id="newcancel">
                        Отмена
                    </button>
                    <button class="btn primary" type="submit">Создать</button>
                </div>
            </form>
        </dialog>

        <script>
            const $ = (s) => document.querySelector(s);
            const con = $("#console"),
                sel = $("#server");
            const LABELS = {
                stopped: "Остановлен",
                starting: "Запускается…",
                running: "Работает",
                stopping: "Останавливается…",
            };
            const DOT = {
                stopped: "🌑",
                starting: "🌘",
                stopping: "🌒",
                running: "🌕",
            };
            const NEW = "__new__",
                MAX_LINES = 3000;
            let current = null,
                state = "stopped",
                p2p = null,
                es = null,
                names = [];

            const q = () => "?server=" + encodeURIComponent(current ?? "");
            const api = (path, body = {}) =>
                fetch("/api/" + path + q(), {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(body),
                }).then((r) => r.json());

            document.querySelectorAll(".tab").forEach(
                (t) =>
                    (t.onclick = () => {
                        document
                            .querySelectorAll(".tab")
                            .forEach((x) =>
                                x.setAttribute("aria-selected", x === t),
                            );
                        document
                            .querySelectorAll("main > section")
                            .forEach((s) => s.classList.remove("active"));
                        $("#view-" + t.dataset.tab).classList.add("active");
                        if (t.dataset.tab === "console")
                            con.scrollTop = con.scrollHeight;
                    }),
            );

            function lineEl(text) {
                const d = document.createElement("div");
                d.textContent = text;
                if (text.startsWith("[panel]")) d.className = "panel";
                else if (text.startsWith("> ")) d.className = "cmd";
                else if (/error|exception|failed/i.test(text))
                    d.className = "err";
                else if (/warning/i.test(text)) d.className = "warn";
                return d;
            }
            function addLines(lines, replace) {
                const stick =
                    replace ||
                    con.scrollTop + con.clientHeight >= con.scrollHeight - 40;
                const frag = document.createDocumentFragment();
                lines.forEach((l) => frag.append(lineEl(l)));
                if (replace) con.replaceChildren();
                con.append(frag);
                while (con.childElementCount > MAX_LINES)
                    con.firstChild.remove();
                if (stick) con.scrollTop = con.scrollHeight;
            }

            function render() {
                const none = current === null;
                $("#status").dataset.s = state;
                $("#status-text").textContent = LABELS[state];
                $("#b-start").disabled = none || state !== "stopped";
                $("#b-stop").disabled =
                    none || state === "stopped" || state === "stopping";
                $("#b-restart").disabled =
                    none || state === "stopped" || state === "stopping";
                const show = state === "running" && p2p;
                $("#connect").classList.toggle("show", !!show);
                if (show) $("#connect-text").textContent = "connect " + p2p;
            }

            async function copyText(t) {
                try {
                    await navigator.clipboard.writeText(t);
                } catch {
                    const a = document.createElement("textarea");
                    a.value = t;
                    document.body.append(a);
                    a.select();
                    document.execCommand("copy");
                    a.remove();
                }
            }
            let copyTimer;
            $("#connect").onclick = async () => {
                await copyText($("#connect-text").textContent);
                const b = $("#connect"),
                    hint = b.querySelector("small");
                b.classList.add("copied");
                hint.textContent = "Скопировано ✓";
                clearTimeout(copyTimer);
                copyTimer = setTimeout(() => {
                    b.classList.remove("copied");
                    hint.textContent = "Нажмите, чтобы скопировать";
                }, 1800);
            };

            async function loadServers() {
                const list = await fetch("/api/servers").then((r) => r.json());
                const label = (s) => `${DOT[s.state]} ${s.name}`;
                const same =
                    list.length === names.length &&
                    list.every((s, i) => s.name === names[i]);
                if (same) {
                    list.forEach((s, i) => {
                        sel.options[i + 0].textContent = label(s);
                    });
                } else {
                    names = list.map((s) => s.name);
                    const opts = list.map((s) => new Option(label(s), s.name));
                    if (!list.length)
                        opts.push(
                            Object.assign(new Option("Нет серверов", ""), {
                                disabled: true,
                            }),
                        );
                    opts.push(new Option("+ Создать новый…", NEW));
                    sel.replaceChildren(...opts);
                }
                sel.value = current ?? "";
                return list;
            }
            sel.onchange = () => {
                if (sel.value === NEW) {
                    sel.value = current ?? "";
                    openDialog();
                } else switchServer(sel.value);
            };

            function switchServer(name) {
                current = name;
                state = "stopped";
                p2p = null;
                try {
                    localStorage.setItem("server", name);
                } catch {}
                sel.value = name;
                if (es) es.close();
                con.replaceChildren();
                render();
                es = new EventSource("/api/events" + q());
                es.onmessage = (e) => {
                    const m = JSON.parse(e.data);
                    if (m.type === "line") addLines([m.text]);
                    else if (m.type === "history") addLines(m.lines, true);
                    else if (m.type === "state") {
                        state = m.state;
                        p2p = m.p2p;
                        render();
                    }
                };
                $("#path").textContent = "servers/" + name + "/";
                loadConfig();
            }

            $("#b-start").onclick = () => api("start");
            $("#b-stop").onclick = () => api("stop");
            $("#b-restart").onclick = () =>
                confirm("Перезапустить сервер?") && api("restart");
            $("#cmdform").onsubmit = async (e) => {
                e.preventDefault();
                const input = $("#cmd"),
                    command = input.value.trim();
                if (!command || current === null) return;
                input.value = "";
                const r = await api("command", { command });
                if (r.error) addLines(["[panel] " + r.error]);
            };

            const form = $("#cfg"),
                msg = $("#msg");
            async function loadConfig() {
                const cfg = await fetch("/api/config" + q()).then((r) =>
                    r.json(),
                );
                msg.textContent = "";
                for (const el of form.elements)
                    if (el.name) {
                        if (el.type === "checkbox") el.checked = !!cfg[el.name];
                        else el.value = cfg[el.name] ?? "";
                    }
            }
            form.onsubmit = async (e) => {
                e.preventDefault();
                if (current === null) return;
                const data = {};
                for (const el of form.elements)
                    if (el.name)
                        data[el.name] =
                            el.type === "checkbox" ? el.checked : el.value;
                const r = await api("config", data);
                msg.className = "msg" + (r.error ? " error" : "");
                msg.textContent = r.error || "Сохранено";
            };

            const dlg = $("#dlg"),
                newmsg = $("#newmsg");
            function openDialog() {
                newmsg.textContent = "";
                $("#newname").value = "";
                dlg.showModal();
                $("#newname").focus();
            }
            $("#newcancel").onclick = () => dlg.close();
            $("#newform").onsubmit = async (e) => {
                e.preventDefault();
                const r = await fetch("/api/servers", {
                    method: "POST",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ name: $("#newname").value }),
                }).then((r) => r.json());
                if (r.error) {
                    newmsg.className = "msg error";
                    newmsg.textContent = r.error;
                    return;
                }
                dlg.close();
                await loadServers();
                switchServer(r.name);
            };

            (async () => {
                const list = await loadServers();
                let first = null;
                try {
                    first = localStorage.getItem("server");
                } catch {}
                if (!list.some((s) => s.name === first))
                    first = list[0]?.name ?? null;
                if (first) switchServer(first);
                else {
                    render();
                    con.innerHTML =
                        '<div class="empty">Серверов пока нет. Создайте первый.</div>';
                    openDialog();
                }
                setInterval(loadServers, 4000);
            })();
        </script>
    </body>
</html>
