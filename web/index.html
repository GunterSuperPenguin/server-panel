<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page-title"></title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/console.css">
<link rel="stylesheet" href="/css/settings.css">
<link rel="stylesheet" href="/css/dialog.css">
</head>
<body class="pending">

<button id="connect" type="button" data-i18n-attr="title:connect-hint">
  <span id="connect-text"></span><small id="connect-hint"></small>
</button>

<header>
  <select id="server" data-i18n-attr="aria-label:lb-server"></select>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="console" data-i18n="tab-console"></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="settings" data-i18n="tab-settings"></button>
  </div>
  <div id="status" data-s="stopped"><i></i><span id="status-text"></span></div>
  <button class="btn primary" id="b-start" data-i18n="btn-start"></button>
  <button class="btn" id="b-stop" data-i18n="btn-stop"></button>
  <button class="btn" id="b-restart" data-i18n="btn-restart"></button>
  <select id="lang" data-i18n-attr="aria-label:lb-language"></select>
</header>

<main>
  <section id="view-console" class="active">
    <div id="console" aria-live="off"></div>
    <form id="cmdform" autocomplete="off">
      <input id="cmd" data-i18n-attr="placeholder:console-placeholder,aria-label:console-label">
    </form>
  </section>

  <section id="view-settings">
    <form id="cfg">
      <label><span data-i18n="settings-collection"></span><input type="text" name="workshop_collection" inputmode="numeric"></label>
      <label><span data-i18n="settings-gamemode"></span><input type="text" name="gamemode"></label>
      <label><span data-i18n="settings-map"></span><input type="text" name="map"></label>
      <label><span data-i18n="settings-maxplayers"></span><input type="number" name="maxplayers" min="1" max="128"></label>
      <label><span data-i18n="settings-port"></span><input type="number" name="port" min="1024" max="65535"></label>
      <label class="check"><input type="checkbox" name="update_on_start"><span data-i18n="settings-update-on-start"></span></label>
      <label class="check"><input type="checkbox" name="auto_restart"><span data-i18n="settings-auto-restart"></span></label>
      <div class="row">
        <button class="btn primary" type="submit" data-i18n="btn-save"></button>
        <span class="msg" id="msg"></span>
      </div>
      <p class="hint"><span data-i18n="settings-files-label"></span> <code id="path"></code></p>
      <p class="hint" data-i18n="settings-apply-note"></p>
    </form>
  </section>
</main>

<dialog id="dlg">
  <h2 data-i18n="dialog-new-title"></h2>
  <form id="newform" autocomplete="off">
    <label><span data-i18n="dialog-new-name"></span>
      <input type="text" id="newname" maxlength="40" data-i18n-attr="placeholder:dialog-new-placeholder" required></label>
    <span class="msg" id="newmsg"></span>
    <div class="row">
      <button class="btn" type="button" id="newcancel" data-i18n="btn-cancel"></button>
      <button class="btn primary" type="submit" data-i18n="btn-create"></button>
    </div>
  </form>
</dialog>

<script type="module" src="/js/main.js"></script>
</body>
</html>
