<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page-title"></title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/console.css">
<link rel="stylesheet" href="/css/combobox.css">
<link rel="stylesheet" href="/css/settings.css">
<link rel="stylesheet" href="/css/dialog.css">
</head>
<body class="pending">

<button id="connect" type="button" data-i18n-attr="title:connect-hint">
  <span id="connect-text"></span><small id="connect-hint"></small>
</button>

<header>
  <select id="server" data-i18n-attr="aria-label:lb-server"></select>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="console" data-i18n="tab-console"></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="settings" data-i18n="tab-settings"></button>
  </div>
  <div id="status" data-s="stopped"><i></i><span id="status-text"></span></div>
  <button class="btn primary" id="b-start" data-i18n="btn-start"></button>
  <button class="btn" id="b-stop" data-i18n="btn-stop"></button>
  <button class="btn" id="b-restart" data-i18n="btn-restart"></button>
  <select id="lang" data-i18n-attr="aria-label:lb-language"></select>
</header>

<main>
  <section id="view-console" class="active">
    <div id="console" aria-live="off"></div>
    <form id="cmdform" autocomplete="off">
      <input id="cmd" data-i18n-attr="placeholder:console-placeholder,aria-label:console-label">
    </form>
  </section>

  <section id="view-settings">
    <form id="cfg">
      <div class="settings-fields">
        <label><span data-i18n="settings-collection"></span><input type="text" name="workshop_collection" inputmode="numeric" placeholder="3743106886"></label>
        <div class="field">
          <label for="f-gamemode" data-i18n="settings-gamemode"></label>
          <div class="combo" id="combo-gamemode">
            <input type="text" id="f-gamemode" name="gamemode" placeholder="sandbox">
            <button type="button" class="combo-toggle" tabindex="-1" data-i18n-attr="aria-label:lb-show-options"></button>
            <ul class="combo-list" hidden></ul>
          </div>
        </div>
        <div class="field">
          <label for="f-map" data-i18n="settings-map"></label>
          <div class="combo" id="combo-map">
            <input type="text" id="f-map" name="map" placeholder="gm_construct">
            <button type="button" class="combo-toggle" tabindex="-1" data-i18n-attr="aria-label:lb-show-options"></button>
            <ul class="combo-list" hidden></ul>
          </div>
        </div>
        <label><span data-i18n="settings-maxplayers"></span><input type="number" name="maxplayers" min="1" max="128" placeholder="12"></label>
        <label><span data-i18n="settings-port"></span><input type="number" name="port" min="1024" max="65535" placeholder="27015"></label>
        <label class="check"><input type="checkbox" name="update_on_start"><span data-i18n="settings-update-on-start"></span></label>
        <label class="check"><input type="checkbox" name="auto_restart"><span data-i18n="settings-auto-restart"></span></label>
        <div class="row">
          <button class="btn primary" type="submit" data-i18n="btn-save"></button>
          <span class="msg" id="msg"></span>
        </div>
        <div class="row">
          <button class="btn" type="button" id="b-open-folder" data-i18n="btn-open-folder"></button>
          <code id="path"></code>
        </div>
        <p class="hint" data-i18n="settings-apply-note"></p>
      </div>
      <div class="settings-cfg">
        <div class="field">
          <label for="server-cfg" data-i18n="settings-server-cfg"></label>
          <textarea id="server-cfg" spellcheck="false" placeholder='sv_hostname "My server"'></textarea>
        </div>
      </div>
    </form>
  </section>
</main>

<dialog id="dlg">
  <h2 data-i18n="dialog-new-title"></h2>
  <form id="newform" autocomplete="off">
    <label><span data-i18n="dialog-new-name"></span>
      <input type="text" id="newname" maxlength="40" data-i18n-attr="placeholder:dialog-new-placeholder" required></label>
    <span class="msg" id="newmsg"></span>
    <div class="row">
      <button class="btn" type="button" id="newcancel" data-i18n="btn-cancel"></button>
      <button class="btn primary" type="submit" data-i18n="btn-create"></button>
    </div>
  </form>
</dialog>

<script type="module" src="/js/main.js"></script>
</body>
</html>
