<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title data-i18n="page-title"></title>
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/layout.css">
<link rel="stylesheet" href="/css/header.css">
<link rel="stylesheet" href="/css/console.css">
<link rel="stylesheet" href="/css/combobox.css">
<link rel="stylesheet" href="/css/settings.css">
<link rel="stylesheet" href="/css/workshop.css">
<link rel="stylesheet" href="/css/dialog.css">
</head>
<body class="pending">

<button id="connect" type="button" data-i18n-attr="title:connect-hint">
  <span id="connect-text"></span><small id="connect-hint"></small>
</button>

<header>
  <select id="server" data-i18n-attr="aria-label:lb-server"></select>
  <div class="tabs" role="tablist">
    <button class="tab" role="tab" aria-selected="true" data-tab="console" data-i18n="tab-console"></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="settings" data-i18n="tab-settings"></button>
    <button class="tab" role="tab" aria-selected="false" data-tab="workshop" data-i18n="tab-workshop"></button>
  </div>
  <div id="status" data-s="stopped"><i></i><span id="status-text"></span></div>
  <button class="btn primary" id="b-start" data-i18n="btn-start"></button>
  <button class="btn" id="b-stop" data-i18n="btn-stop"></button>
  <button class="btn" id="b-restart" data-i18n="btn-restart"></button>
  <select id="lang" data-i18n-attr="aria-label:lb-language"></select>
</header>

<main>
  <section id="view-console" class="active">
    <div id="console" aria-live="off"></div>
    <form id="cmdform" autocomplete="off">
      <input id="cmd" data-i18n-attr="placeholder:console-placeholder,aria-label:console-label">
    </form>
  </section>

  <section id="view-settings">
    <form id="cfg">
      <div class="settings-fields">
        <label><span data-i18n="settings-collection"></span><input type="text" name="workshop_collection" inputmode="numeric" placeholder="3743106886"></label>
        <div class="field">
          <label for="f-gamemode" data-i18n="settings-gamemode"></label>
          <div class="combo" id="combo-gamemode">
            <input type="text" id="f-gamemode" name="gamemode" placeholder="sandbox">
            <button type="button" class="combo-toggle" tabindex="-1" data-i18n-attr="aria-label:lb-show-options"></button>
            <ul class="combo-list" hidden></ul>
          </div>
        </div>
        <div class="field">
          <label for="f-map" data-i18n="settings-map"></label>
          <div class="combo" id="combo-map">
            <input type="text" id="f-map" name="map" placeholder="gm_construct">
            <button type="button" class="combo-toggle" tabindex="-1" data-i18n-attr="aria-label:lb-show-options"></button>
            <ul class="combo-list" hidden></ul>
          </div>
        </div>
        <label><span data-i18n="settings-maxplayers"></span><input type="number" name="maxplayers" min="1" max="128" placeholder="12"></label>
        <label><span data-i18n="settings-port"></span><input type="number" name="port" min="1024" max="65535" placeholder="27015"></label>
        <label class="check"><input type="checkbox" name="update_on_start"><span data-i18n="settings-update-on-start"></span></label>
        <label class="check"><input type="checkbox" name="auto_restart"><span data-i18n="settings-auto-restart"></span></label>
        <div class="row">
          <button class="btn primary" type="submit" data-i18n="btn-save"></button>
          <span class="msg" id="msg"></span>
        </div>
        <div class="row">
          <button class="btn" type="button" id="b-open-folder" data-i18n="btn-open-folder"></button>
          <code id="path"></code>
        </div>
        <p class="hint" data-i18n="settings-apply-note"></p>
      </div>
      <div class="settings-cfg">
        <div class="field">
          <label for="server-cfg" data-i18n="settings-server-cfg"></label>
          <textarea id="server-cfg" spellcheck="false" placeholder='sv_hostname "My server"'></textarea>
        </div>
      </div>
    </form>

  </section>
  <section id="view-workshop">
    <div class="workshop-top"><div><p class="workshop-eyebrow">GARRY'S MOD · WORKSHOP</p><h1 data-i18n="browser-title"></h1><p class="hint" data-i18n="browser-subtitle"></p></div></div>
    <div class="workshop-layout">
      <div class="workshop-browser">
        <form id="workshop-search" class="row">
          <input type="text" id="workshop-query" maxlength="200" data-i18n-attr="placeholder:browser-search-placeholder,aria-label:browser-search">
          <button class="btn primary" data-i18n="browser-search"></button>
        </form>
        <div class="workshop-filters"><div id="workshop-tags" class="row" data-i18n-attr="aria-label:browser-tags"></div>
          <label><span data-i18n="browser-sort"></span><select id="workshop-sort">
            <option value="popular" data-i18n="browser-popular"></option><option value="recent" data-i18n="browser-recent"></option><option value="rated" data-i18n="browser-rated"></option>
          </select></label>
        </div>
        <p id="browser-message" class="msg" role="status"></p>
        <button id="browser-retry" class="btn" hidden data-i18n="browser-retry"></button>
        <div id="workshop-grid" aria-live="polite"></div>
        <nav class="workshop-pages" data-i18n-attr="aria-label:browser-pages">
          <button class="btn" id="workshop-prev" data-i18n="browser-prev"></button><span id="workshop-page"></span><button class="btn" id="workshop-next" data-i18n="browser-next"></button>
        </nav>
      </div>
    <aside id="workshop-editor" aria-labelledby="workshop-heading">
      <h2 id="workshop-heading" data-i18n="workshop-title"></h2>
      <p class="hint" data-i18n="workshop-help"></p>
      <label for="workshop-collections" data-i18n="workshop-collection"></label>
      <select id="workshop-collections"></select>
      <div class="row">
        <input id="workshop-name" maxlength="80" data-i18n-attr="placeholder:workshop-name,aria-label:workshop-name">
        <button class="btn" id="workshop-create" data-i18n="workshop-create"></button>
        <button class="btn" id="workshop-rename" data-i18n="workshop-rename"></button>
        <button class="btn" id="workshop-delete" data-i18n="workshop-delete"></button>
      </div>
      <form id="workshop-add">
        <label for="workshop-ids" data-i18n="workshop-ids"></label>
        <textarea id="workshop-ids" required data-i18n-attr="placeholder:workshop-placeholder"></textarea>
        <button class="btn primary" data-i18n="workshop-add"></button>
      </form>
      <p id="workshop-message" class="msg" role="status"></p>
      <div id="workshop-addons"></div>
    </aside>
    </div>
  </section>
</main>

<dialog id="workshop-preview" aria-labelledby="preview-title">
  <div class="preview-top"><h2 id="preview-title"></h2><button class="btn" id="preview-close" data-i18n="browser-close"></button></div>
  <div id="preview-content"></div>
</dialog>

<dialog id="dlg">
  <h2 data-i18n="dialog-new-title"></h2>
  <form id="newform" autocomplete="off">
    <label><span data-i18n="dialog-new-name"></span>
      <input type="text" id="newname" maxlength="40" data-i18n-attr="placeholder:dialog-new-placeholder" required></label>
    <span class="msg" id="newmsg"></span>
    <div class="row">
      <button class="btn" type="button" id="newcancel" data-i18n="btn-cancel"></button>
      <button class="btn primary" type="submit" data-i18n="btn-create"></button>
    </div>
  </form>
</dialog>

<script type="module" src="/js/main.js"></script>
</body>
</html>
